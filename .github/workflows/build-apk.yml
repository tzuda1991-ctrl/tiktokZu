name: Build Shortzz Release APK

on:
  push:
    branches:
      - main
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Backend Base URL (with trailing slash, e.g. https://your-app.up.railway.app/)'
        required: false
        default: ''
      api_key:
        description: 'Backend API Key (matches APP_API_KEY on Railway)'
        required: false
        default: ''
      split_per_abi:
        description: 'Build split APKs per ABI (smaller download size)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter (3.41.9)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Verify Flutter environment
        run: flutter --version

      - name: Accept Android SDK and NDK licenses
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
          fi
          yes | flutter doctor --android-licenses >/dev/null || true

      - name: Restore google-services.json from Secret (if configured)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            echo "Applied custom google-services.json from GitHub Secrets."
          else
            echo "Using existing android/app/google-services.json from repository."
          fi

      - name: Configure release keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
            cat <<EOF > android/key.properties
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release-keystore.jks
          EOF
            echo "Release keystore configured."
          else
            echo "No release keystore secrets found; using build.gradle default signingConfig."
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Release APK
        env:
          INPUT_BASE_URL: ${{ github.event.inputs.base_url }}
          VAR_BASE_URL: ${{ vars.BASE_URL }}
          INPUT_API_KEY: ${{ github.event.inputs.api_key }}
          SECRET_API_KEY: ${{ secrets.API_KEY }}
          SPLIT_ABI: ${{ github.event.inputs.split_per_abi }}
        run: |
          DART_DEFINES=""
          EFFECTIVE_URL="${INPUT_BASE_URL:-$VAR_BASE_URL}"
          EFFECTIVE_KEY="${INPUT_API_KEY:-$SECRET_API_KEY}"

          if [ -n "$EFFECTIVE_URL" ]; then
            DART_DEFINES="$DART_DEFINES --dart-define=BASE_URL=$EFFECTIVE_URL"
          fi
          if [ -n "$EFFECTIVE_KEY" ]; then
            DART_DEFINES="$DART_DEFINES --dart-define=API_KEY=$EFFECTIVE_KEY"
          fi

          if [ "$SPLIT_ABI" = "true" ]; then
            flutter build apk --release --split-per-abi $DART_DEFINES
          else
            flutter build apk --release $DART_DEFINES
          fi

      - name: Rename APK to Shortzz-v2.1-Fixed.apk
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Shortzz-v2.1-Fixed.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shortzz-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/Shortzz-v2.1-Fixed.apk
          retention-days: 30

      - name: Publish Direct Download GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.1.0
          name: "Shortzz v2.1.0 (Google & Email Login Fixed)"
          body: "Direct APK download with Google Sign-In & Email Login fixed. Please UNINSTALL any previous Shortzz app on your phone before installing Shortzz-v2.1-Fixed.apk."
          files: flutter_app/build/app/outputs/flutter-apk/Shortzz-v2.1-Fixed.apk
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
